<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10100f" />
  <title>ART LOU — Votre avis compte</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #d7bd8a;
      --white: #f7f4ee;
      --black: #10100f;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--black); }
    body {
      color: var(--white);
      font-family: 'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    .hero {
      min-height: 100svh;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      text-align: center;
      padding: 32px 24px 22px;
      isolation: isolate;
    }

    /* ---------- Cinematic stage ---------- */
    .frame {
      position: absolute;
      z-index: -4;
      left: 50%;
      top: 50%;
      width: max(100vw, 177.78svh);
      height: max(100svh, 56.25vw);
      transform: translate(-50%, -50%);
      will-change: transform;
      animation: reveal 1.8s ease both;
    }
    .slide {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 1.6s ease;
    }
    .slide.active { opacity: 1; }
    .cam {
      position: absolute;
      inset: 0;
      transform-origin: var(--fx, 50%) var(--fy, 50%);
      animation: orbit 14s ease-in-out infinite alternate;
      animation-delay: var(--d, 0s);
    }
    .cam img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      user-select: none;
      -webkit-user-drag: none;
    }
    /* Light gleam gliding across the jewel only */
    .sheen {
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg,
        transparent 34%, rgba(255,236,190,0) 41%,
        rgba(255,232,180,.9) 50%,
        rgba(255,236,190,0) 59%, transparent 66%);
      background-size: 300% 100%;
      mix-blend-mode: overlay;
      -webkit-mask-image: radial-gradient(ellipse var(--rx, 28%) var(--ry, 20%) at var(--fx, 50%) var(--fy, 50%), #000 35%, transparent 100%);
              mask-image: radial-gradient(ellipse var(--rx, 28%) var(--ry, 20%) at var(--fx, 50%) var(--fy, 50%), #000 35%, transparent 100%);
      animation: sheen 6s ease-in-out infinite;
      animation-delay: var(--sd, 0s);
      pointer-events: none;
    }
    #dust {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -3;
      pointer-events: none;
    }
    .overlay {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(180deg, rgba(10,10,9,.72) 0%, rgba(10,10,9,.05) 30%, rgba(10,10,9,.05) 58%, rgba(10,10,9,.84) 100%),
        radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.55) 100%);
    }

    /* ---------- Content ---------- */
    .top, .bottom {
      width: min(100%, 760px);
      margin: 0 auto;
      animation: rise 1.1s .3s both;
    }
    .bottom { animation-delay: .55s; align-self: end; }

    .brand {
      font-size: 13px;
      letter-spacing: .48em;
      font-weight: 500;
      color: var(--gold);
      margin-bottom: 22px;
    }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(38px, 5.6vw, 66px);
      line-height: 1;
      font-weight: 400;
      margin: 0 auto;
      text-shadow: 0 2px 24px rgba(0,0,0,.55);
    }
    h1 span { color: var(--gold); }

    .eyebrow {
      font-size: 10px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 14px;
    }
    .description {
      max-width: 520px;
      margin: 0 auto;
      font-size: 14px;
      line-height: 1.8;
      color: rgba(255,255,255,.88);
      font-weight: 300;
      text-shadow: 0 1px 14px rgba(0,0,0,.6);
    }
    .stars {
      color: var(--gold);
      letter-spacing: .35em;
      margin: 18px 0 20px;
      font-size: 17px;
    }
    .review-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      min-height: 58px;
      padding: 0 28px;
      background: var(--gold);
      color: #171510;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .13em;
      text-transform: uppercase;
      border: 1px solid var(--gold);
      transition: background .35s, color .35s, transform .35s, box-shadow .35s;
    }
    .review-button:hover {
      background: transparent;
      color: var(--white);
      transform: translateY(-3px);
      box-shadow: 0 10px 35px rgba(215,189,138,.18);
    }
    .arrow { font-size: 19px; transition: transform .3s; }
    .review-button:hover .arrow { transform: translate(3px, -3px); }

    .dots { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
    .dots button {
      position: relative;
      width: 30px;
      height: 22px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .dots button::after {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 10px;
      height: 2px;
      background: rgba(255,255,255,.32);
      transition: background .4s;
    }
    .dots button[aria-current="true"]::after { background: var(--gold); }
    .dots button:focus-visible { outline: 1px solid var(--gold); outline-offset: 2px; }

    .footer {
      margin-top: 8px;
      color: rgba(255,255,255,.7);
      font-size: 10px;
      letter-spacing: .13em;
    }

    /* ---------- Keyframes ---------- */
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    /* Slow arc: lateral sway, tiny roll and push-in, like a camera on a curved track */
    @keyframes orbit {
      from { transform: translate3d(-2.2%, .4%, 0) rotate(-.7deg) scale(1.05); }
      to   { transform: translate3d(2.2%, -.4%, 0) rotate(.7deg) scale(1.13); }
    }
    @keyframes sheen {
      0%, 12%   { background-position: 100% 0; opacity: 0; }
      30%       { opacity: 1; }
      70%, 100% { background-position: 0% 0; opacity: 0; }
    }

    /* ---------- Portrait phones ---------- */
    @media (orientation: portrait) {
      .frame {
        width: 140vw;
        height: 78.75vw;
        -webkit-mask-image: linear-gradient(to bottom, transparent, #000 16%, #000 84%, transparent);
                mask-image: linear-gradient(to bottom, transparent, #000 16%, #000 84%, transparent);
      }
      .cam { animation-name: orbitPortrait; }
      .brand { margin-bottom: 18px; }
      .description { font-size: 13px; }
      .review-button { width: 100%; max-width: 340px; letter-spacing: .08em; }
    }
    @keyframes orbitPortrait {
      from { transform: translate3d(-8%, 0, 0) rotate(-.7deg) scale(1.02); }
      to   { transform: translate3d(8%, 0, 0) rotate(.7deg) scale(1.1); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .sheen { opacity: 0; }
    }

    /* ART LOU — logo-first cinematic reveal */
    :root { --gold: #d7bd8a; --white: #f7f4ee; }
    .intro { position:fixed; inset:0; z-index:100; background:#10100f; display:grid; place-items:center; pointer-events:none; animation:introOut 1s 2.25s ease-in-out forwards; }
    .intro-mark { text-align:center; color:var(--gold); animation:introMark 1.65s cubic-bezier(.2,.8,.2,1) both; }
    .intro-logo-text { display:block; font-family:'Cormorant Garamond',Georgia,serif; font-size:clamp(50px,11vw,108px); font-weight:500; letter-spacing:.18em; padding-left:.18em; text-shadow:0 0 45px rgba(215,189,138,.25); }
    .intro-rule { height:1px; width:0; margin:16px auto 0; background:linear-gradient(90deg,transparent,var(--gold),transparent); animation:ruleGrow 1.2s .55s ease forwards; }
    .intro-logo-image { max-width:min(72vw,320px); max-height:44vh; object-fit:contain; }
    .brand-logo-image { max-width:150px; max-height:110px; object-fit:contain; display:block; margin:0 auto; }
    .brand { margin-bottom: 12px; }
    .top { animation: cinematicRise 1.1s 2.85s both; }
    .bottom { animation: cinematicRise 1.1s 3.15s both; }
    .frame { animation-delay:2.4s; }
    @keyframes introMark { from { opacity:0; transform:translateY(24px) scale(.93); filter:blur(8px); } to { opacity:1; transform:translateY(0) scale(1); filter:blur(0); } }
    @keyframes ruleGrow { to { width:72%; } }
    @keyframes introOut { to { opacity:0; visibility:hidden; } }
    @keyframes cinematicRise { from {opacity:0; transform:translateY(32px); filter:blur(8px)} to {opacity:1; transform:translateY(0); filter:blur(0)} }
    @media (prefers-reduced-motion:reduce) { .intro {display:none} .top,.bottom {opacity:1; transform:none; filter:none} }


    /* Warm copper-and-espresso intro, matched to the ART LOURINI emblem */
    .intro {
      background: radial-gradient(ellipse at 50% 40%, #68402a 0%, #38251e 43%, #17120f 100%);
    }
    .intro::before {
      content:""; position:absolute; inset:0; pointer-events:none;
      background: radial-gradient(circle at 50% 50%, rgba(212,151,86,.16), transparent 55%);
    }
    .intro-mark { position:relative; display:flex; flex-direction:column; align-items:center; }
    /* Curved, milky-white panel, intentionally soft rather than stark */
    .intro-logo-image {
      position:relative; z-index:1; box-sizing:content-box;
      padding:clamp(18px,4vw,34px);
      border-radius:38px;
      background:rgba(255,251,242,.88);
      box-shadow:0 18px 65px rgba(12,8,6,.30), inset 0 0 28px rgba(255,255,255,.35);
      max-width:min(60vw,265px); max-height:39vh;
    }
    .brand-logo-image {
      box-sizing:content-box;
      padding:9px 13px;
      border-radius:19px;
      background:rgba(255,251,242,.78);
      box-shadow:0 7px 25px rgba(0,0,0,.18);
      max-width:125px; max-height:95px;
    }
    @media(max-width:480px) {
      .intro-logo-image { border-radius:29px; max-width:62vw; padding:19px; }
      .brand-logo-image { max-width:110px; max-height:82px; }
    }
  </style>
</head>

    // Slideshow
    (function () {
      const slides = Array.from(document.querySelectorAll(".slide"));
      const dotsEl = document.getElementById("dots");
      const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let i = 0, timer = null;

      const dots = slides.map((_, n) => {
        const b = document.createElement("button");
        b.type = "button";
        b.setAttribute("aria-label", "Photo " + (n + 1));
        b.addEventListener("click", () => { show(n); restart(); });
        dotsEl.appendChild(b);
        return b;
      });

      function show(n) {
        i = (n + slides.length) % slides.length;
        slides.forEach((s, k) => s.classList.toggle("active", k === i));
        dots.forEach((d, k) => d.setAttribute("aria-current", k === i ? "true" : "false"));
      }
      function restart() {
        clearInterval(timer);
        if (!reduce && !document.hidden) timer = setInterval(() => show(i + 1), 5500);
      }
      document.addEventListener("visibilitychange", restart);
      show(0);
      restart();
    })();

    // Gold dust + pointer parallax (disabled with reduced motion)
    (function () {
      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const cv = document.getElementById("dust");
      const ctx = cv.getContext("2d");
      const frame = document.getElementById("frame");
      let W = 0, H = 0, parts = [];
      let tx = 0, ty = 0, cx = 0, cy = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        cv.width = W * dpr; cv.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        const n = W < 700 ? 40 : 75;
        parts = Array.from({ length: n }, () => ({
          x: Math.random() * W,
          y: Math.random() * H,
          r: .5 + Math.random() * 1.5,
          vx: (Math.random() - .5) * .12,
          vy: -.03 - Math.random() * .12,
          ph: Math.random() * 6.28,
          sp: .6 + Math.random() * 1.4,
          z: .3 + Math.random() * .9
        }));
      }
      window.addEventListener("resize", resize);
      resize();

      window.addEventListener("pointermove", (e) => {
        tx = (e.clientX / window.innerWidth - .5) * 2;
        ty = (e.clientY / window.innerHeight - .5) * 2;
      });

      let t0 = performance.now();
      function tick(now) {
        const dt = Math.min((now - t0) / 16.7, 3); t0 = now;
        cx += (tx - cx) * .05; cy += (ty - cy) * .05;
        frame.style.transform = "translate(-50%,-50%) translate3d(" + (-cx * 14).toFixed(2) + "px," + (-cy * 9).toFixed(2) + "px,0)";

        ctx.clearRect(0, 0, W, H);
        for (const p of parts) {
          p.x += p.vx * dt; p.y += p.vy * dt;
          if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
          if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
          const a = (.25 + .55 * (.5 + .5 * Math.sin(now / 1000 * p.sp + p.ph))) * p.z;
          const x = p.x + cx * 26 * p.z, y = p.y + cy * 16 * p.z;
          ctx.fillStyle = "rgba(225,196,140," + a.toFixed(3) + ")";
          ctx.beginPath(); ctx.arc(x, y, p.r * p.z, 0, 6.2832); ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    })();
  </script>
